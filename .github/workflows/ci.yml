name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax Check Python Scripts
        run: |
          python -m compileall common/
          python -m compileall workers/

      - name: Syntax Check JavaScript Files
        run: |
          node -c workers/minimax-code/src/index.js
          node -c workers/trae-cn/src/index.js
          node -c workers/trae-cn/scripts/decrypt-token.js
          node -c workers/qoder-cn/src/index.js
          node -c workers/workbuddy/src/index.js
          node -c workers/workbuddy/scripts/auth_helper.js
